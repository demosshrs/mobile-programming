<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hamburger Menu</title>
  <link rel="stylesheet" href="script.css" />
</head>
<body>

  <nav>
    <a href="#" class="logo">MyBrand</a>

    <ul class="nav-links">
      <li><a href="#">Home</a></li>
      <li><a href="#">About</a></li>
      <li><a href="#">Services</a></li>
      <li><a href="#">Portfolio</a></li>
      <li><a href="#">Contact</a></li>
    </ul>

    <button class="hamburger" id="hamburger" aria-label="Toggle menu">
      <span></span>
      <span></span>
      <span></span>
    </button>

    <div class="mobile-menu" id="mobileMenu">
      <a href="#">Home</a>
      <a href="#">About</a>
      <a href="#">Services</a>
      <a href="#">Portfolio</a>
      <a href="#">Contact</a>
    </div>
  </nav>

  <section class="hero">
    <h1>Welcome to <span>MyBrand</span></h1>
    <p>Resize the browser window to see the hamburger icon appear on smaller screens. Click it to open and close the navigation menu.</p>
  </section>

  <script src="script.js"></script>

</body>
</html>

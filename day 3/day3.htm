<!DOCTYPE html>
<html>
<head>
  <title>Day 3 - jQuery Practice</title>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <style>
    #profile-card { border: 1px solid #ccc; padding: 15px; width: 300px; }
    #profile-card.highlighted { border: 3px solid orange; background: #fffbe6; }
    #profile-card.dark-mode { background: #0d0d0d; color: white; }
    #profile-photo img { width: 100px; height: 100px;}
    #profile-photo.rounded img { border-radius: 50%; }
    #profile-photo.shadow img { box-shadow: 0 4px 10px rgba(0,0,0,0.4); }
    #output { border: 1px solid #aaa; padding: 8px; margin: 10px 0; min-height: 30px; }
  </style>
</head>
<body>

  <div id="profile-card">
    <div id="profile-photo"><img src="D:\PRG401\mobile-programming\images.jpg"></div>
    <h3 id="student-name">Demos</h3>
    <div id="student-bio">
      <p>I am a <strong>mobile programming</strong> student learning <em>jQuery</em>.</p>
    </div>
    <ul id="skills-list">
      <li>HTML</li>
      <li>CSS</li>
      <li>JavaScript</li>
      <li>jQuery</li>
    </ul>
    <input type="text" id="nickname-input" placeholder="Enter nickname">
  </div>

  <div id="output">Output will appear here</div>

  <h3>1. GET &amp; SET</h3>
  <button id="btn-show-name">Show Name</button>
  <button id="btn-change-name">Change Name</button>
  <button id="btn-show-bio">Show Bio</button>
  <button id="btn-get-input">Get Input</button>
  <button id="btn-set-input">Set Input</button>

  <h3>2. CSS Classes</h3>
  <button id="btn-highlight">Highlight Card</button>
  <button id="btn-remove-highlight">Remove Highlight</button>
  <button id="btn-dark-mode">Toggle Dark Mode</button>
  <button id="btn-rounded">Toggle Rounded</button>

  <h3>3. CSS Method</h3>
  <button id="btn-red-bg">Red Background</button>
  <button id="btn-reset-bg">Reset Background</button>

  <h3>4. Hide &amp; Show</h3>
  <button id="btn-hide-photo">Hide Photo</button>
  <button id="btn-show-photo">Show Photo</button>
  <button id="btn-toggle-bio">Toggle Bio</button>

  <h3>5. Fade</h3>
  <button id="btn-fade-out">Fade Out Card</button>
  <button id="btn-fade-in">Fade In Card</button>
  <button id="btn-fade-50">Fade to 50%</button>

  <h3>6. Slide</h3>
  <button id="btn-slide-up">Slide Up Skills</button>
  <button id="btn-slide-down">Slide Down Skills</button>
  <button id="btn-slide-toggle">Slide Toggle Skills</button>

  <h3>7. Animate</h3>
  <button id="btn-animate">Animate Card</button>

  <h3>8. Events</h3>
  <p>Hover over the photo, or type in the nickname field.</p>

  <script>
    $(function () {

      // 1. GET & SET
      $('#btn-show-name').click(function () { $('#output').text($('#student-name').text()); });
      $('#btn-change-name').click(function () { $('#student-name').text('Demos'); });
      $('#btn-show-bio').click(function () { $('#output').text($('#student-bio').html()); });
      $('#btn-get-input').click(function () { $('#output').text($('#nickname-input').val()); });
      $('#btn-set-input').click(function () { $('#nickname-input').val('jQuery Pro'); });

      // 2. CSS CLASSES
      $('#btn-highlight').click(function () { $('#profile-card').addClass('highlighted'); });
      $('#btn-remove-highlight').click(function () { $('#profile-card').removeClass('highlighted'); });
      $('#btn-dark-mode').click(function () { $('#profile-card').css('background-color', '').toggleClass('dark-mode'); });
      $('#btn-rounded').click(function () { $('#profile-photo').toggleClass('rounded'); });

      // 3. CSS METHOD
      $('#btn-red-bg').click(function () { $('#profile-card').css('background-color', '#e74c3c'); });
      $('#btn-reset-bg').click(function () { $('#profile-card').css('background-color', 'white'); });

      // 4. HIDE & SHOW
      $('#btn-hide-photo').click(function () { $('#profile-photo').hide('slow'); });
      $('#btn-show-photo').click(function () { $('#profile-photo').show('slow'); });
      $('#btn-toggle-bio').click(function () { $('#student-bio').toggle(); });

      // 5. FADE
      $('#btn-fade-out').click(function () { $('#profile-card').fadeOut(); });
      $('#btn-fade-in').click(function () { $('#profile-card').fadeIn(); });
      $('#btn-fade-50').click(function () { $('#profile-card').fadeTo('slow', 0.5); });

      // 6. SLIDE
      $('#btn-slide-up').click(function () { $('#skills-list').slideUp(); });
      $('#btn-slide-down').click(function () { $('#skills-list').slideDown(); });
      $('#btn-slide-toggle').click(function () { $('#skills-list').slideToggle(); });

      // 7. ANIMATE
      $('#btn-animate').click(function () {
        $('#profile-card').animate({ marginLeft: '200px' }, 1000).animate({ marginLeft: '0px' }, 1000);
      });

      // 8. EVENTS
      $('#profile-photo').on('mouseenter', function () { $(this).addClass('shadow'); });
      $('#profile-photo').on('mouseleave', function () { $(this).removeClass('shadow'); });
      $('#nickname-input').on('keypress', function (e) { $('#output').text('Key pressed: ' + e.key); });

    });
  </script>
</body>
</html>

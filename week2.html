<!DOCTYPE html>
<html>
<head>
<title>10 Unique Div Actions</title>

</head>
<body>

    <div class="box" id="div1"><h3>Action 1</h3><button onclick="alert('Hello!')">Alert</button></div>

    <div class="box" id="div2"><h3>Action 2</h3><button onclick="document.getElementById('div2').style.backgroundColor = 'lightblue'">Color</button></div>

    <div class="box" id="div3">
        <h3 id="text3">Original</h3>
        <button onclick="document.getElementById('text3').innerText = 'Changed!'">Toggle Text</button>
    </div>

    <div class="box" id="div4"><h3>Action 4</h3><button onclick="document.getElementById('div4').style.display = 'none'">Hide Me</button></div>

    <div class="box" id="div5"><h3>Action 5</h3><button onclick="document.getElementById('div5').style.borderStyle = 'dashed'">Dash Border</button></div>

    <div class="box" id="div6"><h3>Action 6</h3><p id="date6"></p><button onclick="document.getElementById('date6').innerText = Date()">Show Date</button></div>

    <div class="box" id="div7"><h3>Action 7</h3><button onclick="document.getElementById('div7').style.fontSize = '20px'">Bigger Text</button></div>

    <div class="box" id="div8"><h3>Action 8</h3><button onclick="document.getElementById('div8').style.color = 'red'">Turn Red</button></div>

    <div class="box" id="div9"><h3>Action 9</h3><button onclick="document.getElementById('div9').innerHTML += '<p>New Item</p>'">Add Item</button></div>

    <div class="box" id="div10"><h3>Action 10</h3><button onclick="showImage()">Show Image</button>
    <img id="myImage" src="images.jpg" alt="hello">
    </div>

</body>
</html>
